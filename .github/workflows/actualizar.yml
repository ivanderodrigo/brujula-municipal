name: Actualizar datos de Brújula Municipal
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight de fuentes
        run: python tools/comprobar_fuentes.py
      - name: Sincronizar repositorios / fallbacks
        run: python tools/actualizar_repositorios.py
      - name: Validación básica
        run: echo 'Aquí irían los validadores completos de datos y publicación.'
