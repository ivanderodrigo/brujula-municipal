<!doctype html><html lang="es" data-base="../"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalle de oportunidad · Brújula Municipal</title><meta name="description" content="Detalle, matching municipal y fuente oficial de una oportunidad pública."><link rel="stylesheet" href="../assets/css/styles.css"></head><body><header class="topbar"><div class="shell nav"><a class="brand" href="../">Brújula <span>Municipal</span></a><nav class="navlinks"><a href="../">Inicio</a><a href="../oportunidades/" aria-current="page">Oportunidades</a><a href="../proyectos/">Proyectos</a><a href="../obligaciones/">Obligaciones</a><a href="../apoyo/">Apoyo</a><a href="../quiero/">Quiero…</a><a href="../herramientas/">Herramientas</a><a href="../casos/">Casos</a></nav><div class="nav-actions"><button class="btn municipality-btn" data-open-municipality>⌖ <span data-municipality-label>Seleccionar localidad</span></button></div></div></header><main><section class="detail-hero"><div class="shell" id="opp-detail"><div class="empty">Cargando oportunidad…</div></div></section><section class="section"><div class="shell" id="opp-more"></div></section><script>window.addEventListener('bm-ready',async()=>{const id=new URLSearchParams(location.search).get('id');const data=await BM.opportunities();const o=data.find(x=>x.id===id);if(!o){document.querySelector('#opp-detail').innerHTML='<div class="empty">Oportunidad no encontrada.</div>';return}const p=BM.getProfile(),m=BM.matchOpportunity(o,p),pending=o.review_status==='pending';document.querySelector('#opp-detail').innerHTML=`<a class="small muted" href="./">← Volver al radar</a><div style="margin-top:18px"><span class="status ${BM.statusClass(o.status)}">${o.status_label}</span></div><h1>${o.title}</h1><p class="lede">${o.summary}</p><div class="facts"><div class="fact"><span>Organismo</span><strong style="font-size:16px">${o.organization}</strong></div><div class="fact"><span>Presupuesto/límite</span><strong>${BM.money(o.budget_total||o.budget_local_entities)}</strong></div><div class="fact"><span>Proyecto máximo</span><strong>${BM.money(o.project_max)}</strong></div><div class="fact"><span>${pending?'Fecha detectada':'Última verificación'}</span><strong style="font-size:16px">${pending?(o.deadline||'—'):(o.verified||'—')}</strong></div></div>${pending?`<div class="attention" style="margin-top:20px"><div class="kicker">Radar automático</div><h3>Esta ficha todavía no está verificada editorialmente</h3><p>Ha sido detectada desde la API pública de BDNS. No damos por confirmado que el plazo esté abierto, que ${p?.name||'tu municipio'} sea beneficiario ni que un proyecto concreto sea elegible hasta revisar las bases.</p></div>`:''}${p?`<div class="card" style="margin-top:20px"><div class="kicker">Para ${p.name}</div><h3>${m.label}</h3><div class="tag-list">${m.checks.map(c=>`<span class="status ${c[0]==='pass'?'ok':c[0]==='fail'?'danger':'warn'}">${c[0]==='pass'?'✓':c[0]==='fail'?'×':'?'} ${c[1]}</span>`).join('')}</div><p class="small muted" style="margin-top:10px">El resultado no confirma jurídicamente la condición de beneficiario.</p></div>`:`<button class="btn btn-teal" data-open-municipality style="margin-top:18px">Comprobar con mi municipio</button>`}`;document.querySelector('#opp-more').innerHTML=`<div class="grid grid-2"><div class="card practical"><div class="kicker">Brújula explica</div><h3>${pending?'Por qué ha entrado en el radar':'Qué significa'}</h3><p>${o.summary}</p><p><strong>Temas detectados:</strong> ${(o.topics||[]).join(', ')}</p></div><div class="card check"><div class="kicker">Cautela</div><h3>Qué debes comprobar</h3><p>${o.warning||'Revisar bases, plazo, beneficiarios, gastos elegibles y documentación en la fuente oficial.'}</p></div></div><div class="source" style="margin-top:20px"><strong>Fuente oficial</strong><p class="small">${o.bdns?'BDNS '+o.bdns+' · ':''}${pending?'detección automática pendiente de revisión':'verificada '+(o.verified||'sin fecha')}</p><a class="btn" href="${o.source}" target="_blank" rel="noopener">Abrir ficha oficial ↗</a>${o.update_source?` <a class="btn" href="${o.update_source}" target="_blank" rel="noopener">Abrir actualización ↗</a>`:''}</div>`})</script></main><footer class="footer"><div class="shell footer-grid"><div><div class="brand" style="color:white">Brújula <span>Municipal</span></div><p class="small">La fuente oficial prevalece sobre cualquier resumen o matching.</p></div><div><strong>Rigor</strong><p class="small"><a href="../recursos/">Fuentes y metodología</a></p></div></div></footer><div class="selector-overlay" id="municipality-overlay"><div class="selector"><div class="selector-head"><div><div class="kicker">Mi municipio</div><h2>Selecciona tu localidad</h2></div><button class="close" data-close-municipality aria-label="Cerrar">×</button></div><input class="field" placeholder="Escribe municipio, provincia…"><div class="municipality-results"></div></div></div><script src="../assets/js/app.js"></script></body></html>
